# inject: [web] is the ctx.web SERVICE, not the "web" profile.
# Install into the profile you actually run:
#   dsh plugin --profile desktop add <this>
#   dsh plugin --profile web add <this>
#
# Search backend is chosen on this plugin's settings card:
#   model  → native search markers on the model request (Chat Completions
#            web_search_options + tools type web_search; Responses web_search;
#            Anthropic web_search_20250305; Gemini googleSearch);
#            ready()=false so DSH withholds the local web_search function tool
#   tavily → web_search function tool, Tavily then Bing
#
# Fetch is always local HTTP.
# web-deepseek-api stays loaded so DeepSeek providers remain registered.
# Only the tools are retargeted (searchProvider / fetchProvider).
# web-search-deepseek (Messages search) is off.

- insert:
    - id: dsh-plugin-search
      name: dsh-plugin-search
      inject: [web]
      config:
        searchMode: model
        tavilyApiKey: ""

- id: web
  config:
    searchProvider: simple-search
    fetchProvider: http

- id: web-search-deepseek
  disabled: true
